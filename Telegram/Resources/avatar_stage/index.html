<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Stage</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #101114;
      --bg1: #17191f;
      --card: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #4da3ff;
      --accent-soft: rgba(77,163,255,0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(77,163,255,0.16), transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      color: var(--text);
      font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .avatar-shell {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 65%);
      filter: blur(12px);
      opacity: 0.6;
      transform: scale(1);
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .avatar-card {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .avatar-face {
      width: 138px;
      height: 154px;
      border-radius: 44% 44% 40% 40%;
      background: linear-gradient(180deg, #2c3340, #1a1f2a);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      transform: translateY(4px);
    }

    .eye {
      position: absolute;
      top: 54px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f5f7fb;
      box-shadow: inset 0 0 0 6px #121722;
    }

    .eye.left { left: 28px; }
    .eye.right { right: 28px; }

    .mouth-frame {
      position: absolute;
      left: 50%;
      bottom: 34px;
      width: 44px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      transition: width 120ms ease;
    }

    .mouth {
      position: absolute;
      inset: auto 0 0 0;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, #7ab8ff, #3a7ed7);
      transform-origin: bottom;
      transition: height 60ms linear;
    }

    .badge {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .speaking .halo {
      transform: scale(1.08);
      opacity: 0.95;
    }

    .speaking .avatar-card {
      box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(77,163,255,0.18);
    }

    .live2d-card {
      width: auto;
      height: calc(100% - 20px);
      aspect-ratio: 9 / 16;
      max-width: calc(100% - 20px);
      max-height: calc(100% - 20px);
      padding: 20px;
      background:
        linear-gradient(180deg, rgba(77,163,255,0.12), rgba(255,255,255,0.03)),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    }

    .live2d-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(circle at center, black 48%, transparent 88%);
      opacity: 0.6;
    }

    .live2d-canvas {
      position: absolute;
      inset: 14px 12px 46px 12px;
      z-index: 1;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .live2d-canvas.vrm-interactive {
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
    }

    .live2d-canvas.vrm-interactive.is-dragging {
      cursor: grabbing;
    }

    .live2d-canvas canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      will-change: transform;
    }

    .vrm-zoom-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      will-change: transform;
      z-index: 2;
    }

    .mouth-bar {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      z-index: 1;
    }

    .mouth-bar-fill {
      height: 100%;
      width: 12%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7ab8ff, #3a7ed7);
      transition: width 60ms linear;
    }

    .ai-panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 6;
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(16,17,20,0.72);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.28);
    }

    .ai-panel-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .ai-panel-title {
      min-width: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-panel-status {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      max-height: 45px;
      overflow: hidden;
    }

    .ai-panel-button {
      height: 26px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font: inherit;
      font-size: 11px;
    }

    .ai-panel-button:active {
      background: rgba(77,163,255,0.22);
    }

    .ai-profile-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .ai-profile-button {
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-profile-button.is-active {
      border-color: rgba(77,163,255,0.48);
      background: rgba(77,163,255,0.18);
      color: var(--text);
    }

    .stage-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 5;
    }

    .stage-bootstrap-placeholder {
      opacity: 1;
      pointer-events: none;
      z-index: 1;
    }

    .stage-bootstrap-placeholder.is-hidden {
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .stage-loading.is-visible {
      opacity: 1;
    }

    .stage-loading-shell {
      position: relative;
      width: auto;
      height: calc(100% - 20px);
      aspect-ratio: 9 / 16;
      max-width: calc(100% - 20px);
      max-height: calc(100% - 20px);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(77,163,255,0.10), rgba(255,255,255,0.03)),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      isolation: isolate;
    }

    .stage-loading-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255,255,255,0.04) 30%,
        rgba(255,255,255,0.12) 50%,
        rgba(255,255,255,0.04) 70%,
        transparent 100%
      );
      transform: translateX(-120%);
      animation: stage-loading-sheen 1.2s ease-in-out infinite;
    }

    .stage-loading-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(circle at center, black 48%, transparent 88%);
      opacity: 0.55;
    }

    .stage-loading-orb {
      position: absolute;
      left: 50%;
      top: 28%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(77,163,255,0.20), transparent 68%);
      filter: blur(12px);
      opacity: 0.85;
    }

    .stage-loading-silhouette {
      position: absolute;
      left: 50%;
      bottom: 60px;
      width: 52%;
      height: 70%;
      transform: translateX(-50%);
      border-radius: 46% 46% 18% 18% / 20% 20% 10% 10%;
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 36%, transparent 37%),
        linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.04));
      filter: blur(0.3px);
      opacity: 0.9;
    }

    .stage-loading-silhouette::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 6%;
      width: 74%;
      height: 23%;
      transform: translateX(-50%);
      border-radius: 52% 52% 40% 40%;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,0.20), rgba(255,255,255,0.08) 56%, transparent 57%),
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
    }

    .stage-loading-silhouette::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2%;
      width: 116%;
      height: 40%;
      transform: translateX(-50%);
      border-radius: 44% 44% 18% 18% / 62% 62% 16% 16%;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      opacity: 0.92;
    }

    .stage-loading-silhouette-neck {
      position: absolute;
      left: 50%;
      top: 23%;
      width: 16%;
      height: 10%;
      transform: translateX(-50%);
      border-radius: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
      opacity: 0.85;
    }

    .stage-loading-silhouette-hair {
      position: absolute;
      left: 50%;
      top: 1%;
      width: 92%;
      height: 58%;
      transform: translateX(-50%);
      border-radius: 52% 52% 34% 34% / 28% 28% 20% 20%;
      background:
        linear-gradient(180deg, rgba(77,163,255,0.20), rgba(255,255,255,0.05) 55%, rgba(255,255,255,0.02));
      mask-image:
        radial-gradient(circle at 50% 18%, black 0 48%, transparent 60%),
        linear-gradient(180deg, black 0 80%, transparent 100%);
      opacity: 0.72;
      filter: blur(0.4px);
    }

    .stage-loading-status {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }

    .stage-loading-line {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }

    .stage-loading-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #7ab8ff, #3a7ed7);
      transform-origin: left center;
      animation: stage-loading-pulse 1.1s ease-in-out infinite;
    }

    .stage-loading-copy {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes stage-loading-sheen {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }

    @keyframes stage-loading-pulse {
      0% { transform: scaleX(0.28); opacity: 0.7; }
      50% { transform: scaleX(0.82); opacity: 1; }
      100% { transform: scaleX(0.42); opacity: 0.78; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage-root"></div>
  <section class="ai-panel" aria-label="AI">
    <div class="ai-panel-row">
      <div class="ai-panel-title" data-ai-title>AIRI Avatar</div>
      <button class="ai-panel-button" type="button" data-ai-analyze>LLM</button>
      <button class="ai-panel-button" type="button" data-ai-tts>TTS</button>
    </div>
    <div class="ai-profile-row" data-ai-profiles></div>
    <div class="ai-panel-status" data-ai-status>Waiting for chat context...</div>
  </section>
  <script>
    (function () {
      const root = document.getElementById("stage-root");
      if (!root) {
        return;
      }

      function createBootstrapPlaceholder() {
        const existing = root.querySelector("[data-stage-bootstrap-placeholder]");
        if (existing) {
          return existing;
        }

        const placeholder = document.createElement("div");
        placeholder.className = "stage-loading stage-bootstrap-placeholder is-visible";
        placeholder.setAttribute("data-stage-bootstrap-placeholder", "true");
        placeholder.innerHTML = `
          <div class="stage-loading-shell" aria-hidden="true">
            <div class="stage-loading-grid"></div>
            <div class="stage-loading-orb"></div>
            <div class="stage-loading-silhouette">
              <div class="stage-loading-silhouette-hair"></div>
              <div class="stage-loading-silhouette-neck"></div>
            </div>
            <div class="stage-loading-status">
              <div class="stage-loading-line"></div>
              <div class="stage-loading-copy" data-bootstrap-copy>Waiting for stage...</div>
            </div>
          </div>
        `;
        root.appendChild(placeholder);
        return placeholder;
      }

      const bootstrapState = {
        readySequence: 0,
        readyTimer: null,
        isActive: true,
      };

      function updateBootstrapCopy(detail) {
        const placeholder = createBootstrapPlaceholder();
        const copy = placeholder.querySelector("[data-bootstrap-copy]");
        if (copy) {
          copy.textContent = detail || "Waiting for stage...";
        }
      }

      function emitStageEvent(event) {
        if (window.webkit?.messageHandlers?.stageEvent) {
          window.webkit.messageHandlers.stageEvent.postMessage(event);
          return;
        }
        if (window.external?.invoke) {
          window.external.invoke(JSON.stringify(event));
        }
      }

      function emitBridgeReady(source) {
        bootstrapState.readySequence += 1;
        emitStageEvent({
          type: "bridgeReady",
          source: source || "bootstrap",
          sequence: bootstrapState.readySequence,
        });
      }

      function scheduleBridgeReadyRetries() {
        emitBridgeReady("bootstrap");

        const retryDelays = [150, 500, 1200, 2500];
        retryDelays.forEach(function (delay) {
          window.setTimeout(function () {
            if (bootstrapState.isActive) {
              emitBridgeReady("bootstrap-retry");
            }
          }, delay);
        });

        bootstrapState.readyTimer = window.setInterval(function () {
          if (!bootstrapState.isActive) {
            window.clearInterval(bootstrapState.readyTimer);
            return;
          }
          emitBridgeReady("bootstrap-heartbeat");
        }, 5000);
      }

      window.__stageBridgeBootstrap = {
        emitStageEvent,
        emitBridgeReady,
        updateBootstrapCopy,
        ensureBootstrapPlaceholder: createBootstrapPlaceholder,
        hideBootstrapPlaceholder() {
          createBootstrapPlaceholder().classList.add("is-hidden");
        },
        markBridgeActive() {
          bootstrapState.isActive = false;
          if (bootstrapState.readyTimer) {
            window.clearInterval(bootstrapState.readyTimer);
            bootstrapState.readyTimer = null;
          }
        },
      };

      const pendingCommands = [];
      updateBootstrapCopy("Preparing bridge...");
      scheduleBridgeReadyRetries();

      window.stageBridge = {
        async handleNativeCommand(command) {
          pendingCommands.push(command);
          updateBootstrapCopy(command?.profile?.name ? `Queued ${command.profile.name}...` : "Queued native command...");
        },
      };

      window.__pendingStageCommands = pendingCommands;
    })();
  </script>
  <script>
    (function () {
      const title = document.querySelector("[data-ai-title]");
      const status = document.querySelector("[data-ai-status]");
      const analyze = document.querySelector("[data-ai-analyze]");
      const tts = document.querySelector("[data-ai-tts]");
      const profiles = document.querySelector("[data-ai-profiles]");
      const state = {
        context: null,
        analysis: null,
        profiles: [],
        profileId: "",
      };

      function postEvent(event, data) {
        if (window.TelegramAiBridge?.postEvent) {
          window.TelegramAiBridge.postEvent(event, data || {});
          return;
        }
        if (window.TelegramWebviewProxy?.postEvent) {
          window.TelegramWebviewProxy.postEvent(event, data || {});
          return;
        }
        if (window.external?.invoke) {
          window.external.invoke(JSON.stringify({ event, data: data || {} }));
        }
      }

      function lastMessageText() {
        const messages = Array.isArray(state.context?.messages)
          ? state.context.messages
          : [];
        return messages.length
          ? String(messages[messages.length - 1]?.text || "")
          : "";
      }

      function setStatus(text) {
        if (status) {
          status.textContent = text || "";
        }
      }

      function setActiveProfile(id) {
        state.profileId = id || "";
        profiles?.querySelectorAll("[data-ai-profile-id]").forEach(function (button) {
          button.classList.toggle("is-active", button.dataset.aiProfileId === state.profileId);
        });
      }

      function renderProfiles(items, defaultProfileId) {
        state.profiles = Array.isArray(items) ? items : [];
        if (!profiles) {
          return;
        }
        profiles.replaceChildren();
        state.profiles.forEach(function (profile) {
          const button = document.createElement("button");
          button.className = "ai-profile-button";
          button.type = "button";
          button.textContent = profile.rendererType === "live2d" ? "Live2D" : "VRM";
          button.dataset.aiProfileId = String(profile.id || "");
          button.addEventListener("click", function () {
            setActiveProfile(profile.id);
            if (title) {
              title.textContent = profile.name || "AIRI Avatar";
            }
            postEvent("request_avatar_profile", { id: profile.id });
          });
          profiles.appendChild(button);
        });
        setActiveProfile(defaultProfileId || state.profiles[0]?.id || "");
      }

      window.addEventListener("telegram-ai:aiCapabilities", function (event) {
        const avatar = event.detail?.avatar || {};
        if (title) {
          title.textContent = avatar.name || "AIRI Avatar";
        }
        renderProfiles(avatar.profiles, avatar.defaultProfileId);
      });

      window.addEventListener("telegram-ai:chatContext", function (event) {
        state.context = event.detail || null;
        const messages = Array.isArray(state.context?.messages)
          ? state.context.messages
          : [];
        if (!state.context?.available) {
          setStatus("No active chat.");
          return;
        }
        setStatus(`${state.context.title || "Chat"} · ${messages.length} messages ready`);
      });

      window.addEventListener("telegram-ai:aiAnalysis", function (event) {
        state.analysis = event.detail || null;
        if (!state.analysis?.ok) {
          setStatus(state.analysis?.error?.message || "LLM context unavailable.");
          return;
        }
        setStatus(state.analysis.displayText || `LLM context: ${state.analysis.messageCount || 0} messages`);
      });

      window.addEventListener("telegram-ai:ttsStatus", function (event) {
        if (event.detail?.error?.message) {
          setStatus(event.detail.error.message);
        } else if (event.detail?.speaking) {
          setStatus("TTS preview speaking...");
        } else if (state.analysis?.displayText) {
          setStatus(state.analysis.displayText);
        }
      });

      analyze?.addEventListener("click", function () {
        postEvent("request_ai_analysis", { context: state.context });
      });

      tts?.addEventListener("click", function () {
        postEvent("request_tts", {
          text: state.analysis?.speechText || state.analysis?.displayText || lastMessageText() || "AIRI avatar TTS preview",
        });
      });
    })();
  </script>
  <script src="./runtime-core.js"></script>
  <script src="./providers/placeholder-provider.js"></script>
  <script src="./stage-bridge.js"></script>
  <script src="./live2d-runtime.js"></script>
  <script src="./live2d-lipsync.js"></script>
  <script src="./vrm-vendor.js"></script>
  <script src="./vrm-loader.js"></script>
  <script src="./vrm-core.js"></script>
  <script src="./vrm-lipsync.js"></script>
  <script src="./providers/live2d-provider.js"></script>
  <script src="./providers/vrm-provider.js"></script>
</body>
</html>
